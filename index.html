<!DOCTYPE html>
<html>
<head>
  <title>Ultimate Mini Car Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #a0e9ff;
      font-family: sans-serif;
    }

    .road {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100px;
      background: #555;
    }

    .car {
      width: 140px;
      height: 45px;
      background: linear-gradient(90deg, #0a0a0a, #1a1a1a);
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 25px 25px 15px 15px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.6);
      border: 3px solid #00bfff;
    }

    /* Car details, headlights, wheels remain the same */

    .block {
      width: 50px;
      height: 50px;
      position: absolute;
      top: -50px;
      border-radius: 5px;
    }

    .green { background: green; }
    .red { background: red; }
    .boost { background: gold; border: 3px solid #ffaa00; }

    #score, #highScore, #level {
      position: absolute;
      left: 10px;
      font-size: 20px;
      color: #000;
    }

    #score { top: 10px; }
    #highScore { top: 40px; }
    #level { top: 70px; }

    #boostBtn {
      position: absolute;
      top: 70px;
      left: 10px;
      padding: 8px 12px;
      background: gold;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      display: none; /* kept hidden; boosts now drop as items */
    }

    .controls {
      position: absolute;
      right: 10px;
      bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .controls button {
      width: 60px;
      height: 40px;
      font-size: 18px;
      border-radius: 5px;
      border: none;
      background: #333;
      color: #fff;
      cursor: pointer;
    }

    .controls-row {
      display: flex;
      gap: 5px;
      justify-content: center;
    }
  </style>
</head>
<body>

<div id="score">Score: 0</div>
<div id="highScore">High Score: 0</div>
<div id="level">Level: 0</div>
<button id="boostBtn">⚡ BOOST!</button>
<div class="road"></div>

<div class="car" id="playerCar"></div>

<div class="controls">
  <div class="controls-row">
    <button id="forward">↑</button>
  </div>
  <div class="controls-row">
    <button id="left">←</button>
    <button id="backward">↓</button>
    <button id="right">→</button>
  </div>
</div>

<script>
  const car = document.getElementById('playerCar');
  const boostBtn = document.getElementById('boostBtn');

  let carX = window.innerWidth / 2 - 70;
  let carY = window.innerHeight - 150;
  let score = 0;
  let level = 0;
  let highScore = 0;
  let carSpeed = 40;
  const normalSpeed = 40;
  const boostSpeed = normalSpeed * 2;
  const blockSpeed = 3;

  // Track boost timer so picking another boost resets duration rather than stacking
  let boostTimer = null;

  function updateCarPosition() {
    car.style.left = carX + 'px';
    car.style.top = carY + 'px';
  }

  function updateScores() {
    document.getElementById('score').innerText = 'Score: ' + score;
    document.getElementById('highScore').innerText = 'High Score: ' + highScore;
    document.getElementById('level').innerText = 'Level: ' + level;
  }

  // Movement via buttons
  function moveCar(dx, dy) {
    carX += dx;
    carY += dy;
    carX = Math.max(0, Math.min(window.innerWidth - 140, carX));
    carY = Math.max(0, Math.min(window.innerHeight - 45, carY));
    updateCarPosition();
  }

  document.getElementById('forward').onclick = () => moveCar(0, -carSpeed);
  document.getElementById('backward').onclick = () => moveCar(0, carSpeed);
  document.getElementById('left').onclick = () => moveCar(-carSpeed, 0);
  document.getElementById('right').onclick = () => moveCar(carSpeed, 0);

  // Keep a reference to the original background so we can restore it after a boost
  const originalBackground = car.style.background || '';

  function applyBoost() {
    // reset existing boost timer so duration restarts
    if (boostTimer) clearTimeout(boostTimer);

    carSpeed = boostSpeed;
    car.style.background = 'orange';

    boostTimer = setTimeout(() => {
      carSpeed = normalSpeed;
      car.style.background = originalBackground; // revert to CSS-styled background
      boostTimer = null;
    }, 5000); // BOOST lasts 5 seconds
  }

  function createBlock() {
    const block = document.createElement('div');

    block.className = 'block green';
    block.style.left = Math.random() * (window.innerWidth - 50) + 'px';
    document.body.appendChild(block);

    let blockY = -50;
    const interval = setInterval(() => {
      blockY += blockSpeed;
      block.style.top = blockY + 'px';

      const carRect = car.getBoundingClientRect();
      const blockRect = block.getBoundingClientRect();

      if (!(carRect.right < blockRect.left || 
            carRect.left > blockRect.right || 
            carRect.bottom < blockRect.top || 
            carRect.top > blockRect.bottom)) {

        // Regular block: increase score
        score += 1;
        if (score > highScore) highScore = score;
        level = Math.floor(score / 10);

        updateScores();
        clearInterval(interval);
        block.remove();
      }

      if (blockY > window.innerHeight) {
        clearInterval(interval);
        block.remove();
      }
    }, 30);
  }

  // Create a boost item that drops every 15 seconds
  function createBoost() {
    const block = document.createElement('div');
    block.className = 'block boost';
    block.style.left = Math.random() * (window.innerWidth - 50) + 'px';
    // slightly bigger so it stands out
    block.style.width = '60px';
    block.style.height = '60px';
    document.body.appendChild(block);

    let blockY = -60;
    const interval = setInterval(() => {
      blockY += blockSpeed;
      block.style.top = blockY + 'px';

      const carRect = car.getBoundingClientRect();
      const blockRect = block.getBoundingClientRect();

      if (!(carRect.right < blockRect.left || 
            carRect.left > blockRect.right || 
            carRect.bottom < blockRect.top || 
            carRect.top > blockRect.bottom)) {

        // Apply boost for 5 seconds
        applyBoost();

        clearInterval(interval);
        block.remove();
      }

      if (blockY > window.innerHeight) {
        clearInterval(interval);
        block.remove();
      }
    }, 30);
  }

  setInterval(createBlock, 2000);
  setInterval(createBoost, 15000); // boost item drops every 15 seconds

  updateCarPosition();
  updateScores();
</script>

</body>
</html>
