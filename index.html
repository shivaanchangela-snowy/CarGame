<!DOCTYPE html>
<html>
<head>
  <title>Ultimate Mini Car Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #a0e9ff;
      font-family: sans-serif;
    }

    .road {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100px;
      background: #555;
    }

    .car {
      width: 140px;
      height: 45px;
      background: linear-gradient(90deg, #0a0a0a, #1a1a1a);
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 25px 25px 15px 15px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.6);
      border: 3px solid #00bfff;
    }

    /* Car details, headlights, wheels remain the same */

    .block {
      width: 50px;
      height: 50px;
      position: absolute;
      top: -50px;
      border-radius: 5px;
    }

    .green { background: green; }
    .red { background: red; }
    .boost { background: gold; border: 3px solid #ffaa00; }

    #score, #highScore, #level {
      position: absolute;
      left: 10px;
      font-size: 20px;
      color: #000;
    }

    #score { top: 10px; }
    #highScore { top: 40px; }
    #level { top: 70px; }

    /* boost timer display */
    #boostTimer {
      position: absolute;
      left: 10px;
      top: 100px;
      font-size: 18px;
      color: #000;
      display: none;
      background: rgba(255,255,255,0.8);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    #boostBtn {
      position: absolute;
      top: 70px;
      left: 10px;
      padding: 8px 12px;
      background: gold;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      display: none; /* kept hidden; boosts now drop as items */
    }

    .controls {
      position: absolute;
      right: 10px;
      bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .controls button {
      width: 60px;
      height: 40px;
      font-size: 18px;
      border-radius: 5px;
      border: none;
      background: #333;
      color: #fff;
      cursor: pointer;
    }

    .controls-row {
      display: flex;
      gap: 5px;
      justify-content: center;
    }
  </style>
</head>
<body>

<div id="score">Score: 0</div>
<div id="highScore">High Score: 0</div>
<div id="level">Level: 0</div>
<div id="boostTimer">Boost: 0s</div>
<button id="boostBtn">⚡ BOOST!</button>
<div class="road"></div>

<div class="car" id="playerCar"></div>

<div class="controls">
  <div class="controls-row">
    <button id="forward">↑</button>
  </div>
  <div class="controls-row">
    <button id="left">←</button>
    <button id="backward">↓</button>
    <button id="right">→</button>
  </div>
</div>

<script>
  const car = document.getElementById('playerCar');
  const boostBtn = document.getElementById('boostBtn');
  const boostTimerElem = document.getElementById('boostTimer');

  let carX = window.innerWidth / 2 - 70;
  let carY = window.innerHeight - 150;
  let score = 0;
  let level = 0;
  let highScore = 0;

  // widths (car length)
  let carWidth = 140;
  const normalWidth = 140;
  const boostWidth = normalWidth * 2; // 2x length

  let carSpeed = 40; // movement amount per button press
  const normalSpeed = 40;
  const blockSpeed = 3;

  // boost timers/handles
  let boostTimeout = null; // revert timeout
  let boostCountdownInterval = null; // UI countdown interval
  let boostRemaining = 0; // seconds

  function updateCarPosition() {
    car.style.width = carWidth + 'px';
    car.style.left = carX + 'px';
    car.style.top = carY + 'px';
  }

  function updateScores() {
    document.getElementById('score').innerText = 'Score: ' + score;
    document.getElementById('highScore').innerText = 'High Score: ' + highScore;
    document.getElementById('level').innerText = 'Level: ' + level;
  }

  // Movement via buttons
  function moveCar(dx, dy) {
    carX += dx;
    carY += dy;
    // clamp using current car width
    carX = Math.max(0, Math.min(window.innerWidth - carWidth, carX));
    carY = Math.max(0, Math.min(window.innerHeight - 45, carY));
    updateCarPosition();
  }

  document.getElementById('forward').onclick = () => moveCar(0, -carSpeed);
  document.getElementById('backward').onclick = () => moveCar(0, carSpeed);
  document.getElementById('left').onclick = () => moveCar(-carSpeed, 0);
  document.getElementById('right').onclick = () => moveCar(carSpeed, 0);

  // Keep a reference to computed background so we can restore it after a boost
  const originalBackground = window.getComputedStyle(car).background || '';

  function updateBoostUI() {
    if (boostRemaining > 0) {
      boostTimerElem.style.display = 'block';
      boostTimerElem.innerText = 'Boost: ' + Math.ceil(boostRemaining) + 's';
    } else {
      boostTimerElem.style.display = 'none';
      boostTimerElem.innerText = 'Boost: 0s';
    }
  }

  function applyBoost() {
    // reset existing boost timers so duration restarts
    if (boostTimeout) clearTimeout(boostTimeout);
    if (boostCountdownInterval) clearInterval(boostCountdownInterval);

    // apply visual and size change
    carWidth = boostWidth;
    car.style.background = 'orange';

    // ensure car doesn't go off-screen after growing; adjust carX if needed
    carX = Math.max(0, Math.min(window.innerWidth - carWidth, carX));
    updateCarPosition();

    // start 5s boost
    boostRemaining = 5;
    updateBoostUI();

    boostCountdownInterval = setInterval(() => {
      boostRemaining -= 0.1; // decrement by 100ms
      if (boostRemaining <= 0) boostRemaining = 0;
      updateBoostUI();
    }, 100);

    boostTimeout = setTimeout(() => {
      // revert size and visuals
      carWidth = normalWidth;
      car.style.background = originalBackground;
      // ensure car is clamped back inside
      carX = Math.max(0, Math.min(window.innerWidth - carWidth, carX));
      updateCarPosition();

      // clear timers
      if (boostCountdownInterval) { clearInterval(boostCountdownInterval); boostCountdownInterval = null; }
      boostTimeout = null;
      boostRemaining = 0;
      updateBoostUI();
    }, 5000);
  }

  function createBlock() {
    const block = document.createElement('div');

    block.className = 'block green';
    block.style.left = Math.random() * (window.innerWidth - 50) + 'px';
    document.body.appendChild(block);

    let blockY = -50;
    const interval = setInterval(() => {
      blockY += blockSpeed;
      block.style.top = blockY + 'px';

      const carRect = car.getBoundingClientRect();
      const blockRect = block.getBoundingClientRect();

      if (!(carRect.right < blockRect.left || 
            carRect.left > blockRect.right || 
            carRect.bottom < blockRect.top || 
            carRect.top > blockRect.bottom)) {

        // Regular block: increase score by 2
        score += 2;
        if (score > highScore) highScore = score;
        level = Math.floor(score / 10);

        updateScores();
        clearInterval(interval);
        block.remove();
      }

      if (blockY > window.innerHeight) {
        clearInterval(interval);
        block.remove();
      }
    }, 30);
  }

  // Create a boost item that drops every 15 seconds
  function createBoost() {
    const block = document.createElement('div');
    block.className = 'block boost';
    block.style.left = Math.random() * (window.innerWidth - 60) + 'px';
    // slightly bigger so it stands out
    block.style.width = '60px';
    block.style.height = '60px';
    document.body.appendChild(block);

    let blockY = -60;
    const interval = setInterval(() => {
      blockY += blockSpeed;
      block.style.top = blockY + 'px';

      const carRect = car.getBoundingClientRect();
      const blockRect = block.getBoundingClientRect();

      if (!(carRect.right < blockRect.left || 
            carRect.left > blockRect.right || 
            carRect.bottom < blockRect.top || 
            carRect.top > blockRect.bottom)) {

        // Apply boost that doubles car length for 5 seconds
        applyBoost();

        clearInterval(interval);
        block.remove();
      }

      if (blockY > window.innerHeight) {
        clearInterval(interval);
        block.remove();
      }
    }, 30);
  }

  setInterval(createBlock, 2000);
  setInterval(createBoost, 15000); // boost item drops every 15 seconds

  updateCarPosition();
  updateScores();
  updateBoostUI();

  // Keep the car centered horizontally on initial load
  // (since CSS transform translateX(-50%) is applied, we set carX so the visual initial position matches)
  window.addEventListener('load', () => {
    // position carX to visually center (accounting for transform)
    carX = window.innerWidth / 2 - (carWidth / 2);
    carY = window.innerHeight - 150;
    updateCarPosition();
  });

  // Also update bounds if window resizes
  window.addEventListener('resize', () => {
    carX = Math.max(0, Math.min(window.innerWidth - carWidth, carX));
    carY = Math.max(0, Math.min(window.innerHeight - 45, carY));
    updateCarPosition();
  });
</script>

</body>
</html>
